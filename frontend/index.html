<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Budget Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-slate-950 text-slate-100">
  <div class="max-w-4xl mx-auto px-6 py-8">
    <!-- Header -->
    <header class="flex items-start justify-between gap-4 mb-8">
      <div>
        <h1 class="text-3xl font-semibold tracking-tight">Budget Tracker</h1>
        <p class="text-slate-400 mt-1">Weekly budget with Gmail receipt sync</p>
      </div>

      <div class="flex items-center gap-2">
        <a href="http://127.0.0.1:8000/gmail/login"
           class="px-3 py-2 bg-indigo-600 hover:bg-indigo-500 text-sm font-medium rounded-md">
          Connect Gmail
        </a>
        <button id="syncBtn"
                class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-sm font-medium rounded-md border border-slate-700">
          Sync
        </button>
      </div>
    </header>

    <!-- Top row: Summary + Chart -->
    <section class="grid lg:grid-cols-3 gap-6 mb-8">
      <!-- Summary (less clutter: one panel) -->
      <div class="lg:col-span-1 bg-slate-900 border border-slate-800 rounded-md p-5">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-medium text-slate-300">This Week</h2>
          <button id="resetBtn" class="text-xs px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded-md border border-slate-700">
            Reset Week
          </button>
        </div>

        <div class="mt-4 space-y-3">
          <div class="flex items-baseline justify-between">
            <span class="text-slate-400 text-sm">Weekly Limit</span>
            <span id="weeklyLimit" class="text-lg font-semibold">$—</span>
          </div>
          <div class="flex items-baseline justify-between">
            <span class="text-slate-400 text-sm">Remaining</span>
            <span id="remaining" class="text-lg font-semibold">$—</span>
          </div>

          <!-- Progress bar -->
          <div class="pt-2">
            <div class="h-2 w-full bg-slate-800 border border-slate-700 rounded-none">
              <div id="progressBar" class="h-2 bg-emerald-500" style="width:0%"></div>
            </div>
            <div class="flex justify-between mt-2">
              <p id="progressText" class="text-xs text-slate-400">0% used</p>
              <p id="lowWarn" class="text-xs text-red-400 hidden">Low budget</p>
            </div>
          </div>

          <!-- Inline actions -->
          <div class="pt-3 border-t border-slate-800">
            <label class="text-xs text-slate-400">Set weekly budget</label>
            <div class="flex gap-2 mt-2">
              <input id="budgetInput" type="number" step="0.01"
                class="w-full bg-slate-950 border border-slate-800 rounded-md px-3 py-2 text-sm outline-none focus:border-slate-600"
                placeholder="e.g. 200" />
              <button id="setBudgetBtn"
                class="px-3 py-2 bg-emerald-600 hover:bg-emerald-500 text-sm font-medium rounded-md">
                Save
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Chart -->
      <div class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-md p-5">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-sm font-medium text-slate-300">Spending (last 7 days)</h2>
          <button id="refreshAllBtn" class="text-xs px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded-md border border-slate-700">
            Refresh
          </button>
        </div>
        <div class="h-56">
          <canvas id="spendChart"></canvas>
        </div>
        <div class="mt-4 flex items-baseline justify-between">
          <span class="text-slate-400 text-sm">Weekly spent</span>
          <span id="weeklySpent" class="text-lg font-semibold">$—</span>
        </div>
      </div>
    </section>

    <!-- Bottom: Add transaction + list -->
    <section class="grid lg:grid-cols-3 gap-6">
      <!-- Add transaction -->
      <div class="lg:col-span-1 bg-slate-900 border border-slate-800 rounded-md p-5">
        <h2 class="text-sm font-medium text-slate-300">Add transaction</h2>
        <div class="mt-4 space-y-2">
          <input id="amountInput" type="number" step="0.01"
            class="w-full bg-slate-950 border border-slate-800 rounded-md px-3 py-2 text-sm outline-none focus:border-slate-600"
            placeholder="Amount" />
          <input id="storeInput" type="text"
            class="w-full bg-slate-950 border border-slate-800 rounded-md px-3 py-2 text-sm outline-none focus:border-slate-600"
            placeholder="Store (Amazon, Uber…)" />
          <button id="addTxBtn"
            class="w-full px-3 py-2 bg-blue-600 hover:bg-blue-500 text-sm font-medium rounded-md">
            Add
          </button>
        </div>
        <p class="text-xs text-slate-500 mt-3">
          Tip: use this for cash purchases; Gmail sync handles online receipts.
        </p>
      </div>

      <!-- Transactions list -->
      <div class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-md p-5">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-medium text-slate-300">Recent transactions</h2>
          <button id="refreshTxBtn" class="text-xs px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded-md border border-slate-700">
            Refresh
          </button>
        </div>

        <div class="mt-4 border border-slate-800">
          <div class="grid grid-cols-3 text-xs text-slate-400 bg-slate-950 px-3 py-2 border-b border-slate-800">
            <div>Store</div>
            <div>Date</div>
            <div class="text-right">Amount</div>
          </div>
          <div id="txList" class="divide-y divide-slate-800"></div>
        </div>
      </div>
    </section>
  </div>

<script>
const API = "";

function money(n) {
  if (n === null || n === undefined || Number.isNaN(Number(n))) return "$—";
  return "$" + Number(n).toFixed(2);
}

function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleString();
}

// ----- Chart -----
let chart;
function renderChart(labels, values) {
  const ctx = document.getElementById("spendChart");
  if (chart) chart.destroy();

  chart = new Chart(ctx, {
    type: "bar",
    data: {
      labels,
      datasets: [{
        label: "Spent",
        data: values
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false }
      },
      scales: {
        x: {
          ticks: { color: "#cbd5e1" },
          grid: { color: "rgba(148,163,184,0.15)" }
        },
        y: {
          ticks: { color: "#cbd5e1" },
          grid: { color: "rgba(148,163,184,0.15)" }
        }
      }
    }
  });
}

// ----- Loaders -----
async function loadBudget() {
  const res = await fetch(API + "/budget");
  const data = await res.json();
  if (data.error) return;

  const weekly = Number(data.weekly_limit);
  const remaining = Number(data.remaining);
  const usedPct = weekly > 0 ? ((weekly - remaining) / weekly) * 100 : 0;

  document.getElementById("weeklyLimit").textContent = money(weekly);
  document.getElementById("remaining").textContent = money(remaining);

  const bar = document.getElementById("progressBar");
  bar.style.width = `${Math.min(100, Math.max(0, usedPct))}%`;
  bar.classList.remove("bg-emerald-500", "bg-yellow-500", "bg-red-500");
  if (usedPct >= 90) bar.classList.add("bg-red-500");
  else if (usedPct >= 75) bar.classList.add("bg-yellow-500");
  else bar.classList.add("bg-emerald-500");

  document.getElementById("progressText").textContent = `${usedPct.toFixed(1)}% used`;

  const statusRes = await fetch(API + "/budget_status");
  const status = await statusRes.json();
  const lowWarn = document.getElementById("lowWarn");
  if (!status.error && status.low_budget) lowWarn.classList.remove("hidden");
  else lowWarn.classList.add("hidden");
}

async function loadTransactions() {
  const res = await fetch(API + "/transactions");
  const txs = await res.json();
  const list = document.getElementById("txList");
  list.innerHTML = "";

  txs.slice(0, 15).forEach(t => {
    const row = document.createElement("div");
    row.className = "grid grid-cols-3 px-3 py-2 text-sm bg-slate-900";
    row.innerHTML = `
      <div class="truncate">${t.store}</div>
      <div class="text-slate-400 text-xs">${fmtDate(t.created_at)}</div>
      <div class="text-right font-medium">${money(t.amount)}</div>
    `;
    list.appendChild(row);
  });
}

async function loadWeeklyChart() {
  // This endpoint we’ll add in FastAPI below
  const res = await fetch(API + "/spending_by_day");
  const data = await res.json();

  renderChart(data.labels, data.values);
  document.getElementById("weeklySpent").textContent = money(data.total);
}

// ----- Actions -----
document.getElementById("setBudgetBtn").onclick = async () => {
  const amount = document.getElementById("budgetInput").value;
  await fetch(API + `/set_budget/?amount=${encodeURIComponent(amount)}`, { method: "POST" });
  await loadBudget();
};

document.getElementById("addTxBtn").onclick = async () => {
  const amount = document.getElementById("amountInput").value;
  const store = document.getElementById("storeInput").value || "Manual";
  await fetch(API + `/add_transaction/?amount=${encodeURIComponent(amount)}&store=${encodeURIComponent(store)}`, { method: "POST" });

  document.getElementById("amountInput").value = "";
  document.getElementById("storeInput").value = "";

  await loadBudget();
  await loadTransactions();
  await loadWeeklyChart();
};

document.getElementById("syncBtn").onclick = async () => {
  const btn = document.getElementById("syncBtn");
  btn.disabled = true;
  btn.textContent = "Syncing...";
  try {
    await fetch(API + `/gmail/sync`, { method: "POST" });
    await loadBudget();
    await loadTransactions();
    await loadWeeklyChart();
  } finally {
    btn.disabled = false;
    btn.textContent = "Sync";
  }
};

document.getElementById("resetBtn").onclick = async () => {
  await fetch(API + `/reset_week`, { method: "POST" });
  await loadBudget();
  await loadWeeklyChart();
};

document.getElementById("refreshAllBtn").onclick = async () => {
  await loadBudget();
  await loadTransactions();
  await loadWeeklyChart();
};

document.getElementById("refreshTxBtn").onclick = loadTransactions;

// Initial load
loadBudget();
loadTransactions();
loadWeeklyChart();
</script>
</body>
</html>
